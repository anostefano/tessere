<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tessere</title>
<meta name="description" content="Le tue carte fedeltà, sempre a portata di mano.">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tessere">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --bg:#F2F3F7;
  --surface:#FFFFFF;
  --surface-2:#E4E6EC;
  --chip:#FFFFFF;
  --ink:#191C1F;
  --ink-2:#6F7480;
  --line:rgba(25,28,31,.08);
  --press:rgba(25,28,31,.05);
  --accent:#0666EB;
  --accent-soft:rgba(6,102,235,.10);
  --danger:#E0263A;
  --danger-soft:rgba(224,38,58,.10);
  --scrim:rgba(10,12,16,.42);
  --toast-bg:#191C1F;
  --toast-ink:#FFFFFF;
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;
    --surface:#17181C;
    --surface-2:#1F2025;
    --chip:#35363C;
    --ink:#F5F6F8;
    --ink-2:#8E929C;
    --line:rgba(255,255,255,.08);
    --press:rgba(255,255,255,.06);
    --accent:#3D8BFF;
    --accent-soft:rgba(61,139,255,.16);
    --danger:#FF4D5E;
    --danger-soft:rgba(255,77,94,.16);
    --scrim:rgba(0,0,0,.6);
    --toast-bg:#F5F6F8;
    --toast-ink:#111214;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.has-layer{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* ---------- Home ---------- */
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.title{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.032em;margin:6px 0 0}
.subtitle{margin:4px 0 0;color:var(--ink-2);font-size:15px;font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg.i{width:20px;height:20px}

.install{display:flex;gap:12px;align-items:flex-start;margin:18px 0 0;padding:14px 12px 14px 14px;border-radius:20px;background:var(--surface)}
.install-ico{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.install-ico svg.i{width:20px;height:20px}
.install-text{flex:1;font-size:14px;line-height:1.4;color:var(--ink-2)}
.install-text strong{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:2px}
.install .icon-btn{width:32px;height:32px;background:transparent;color:var(--ink-2)}

.tools{display:flex;flex-direction:column;gap:12px;margin:18px 0 16px}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:999px;background:var(--surface);color:var(--ink-2)}
.search svg.i{width:19px;height:19px}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-2)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search-clear{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.search-clear svg.i{width:16px;height:16px}
.seg{display:inline-flex;align-self:flex-start;padding:3px;border-radius:999px;background:var(--surface-2)}
.seg button{height:32px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.no-results{grid-column:1/-1;text-align:center;color:var(--ink-2);padding:40px 16px;margin:0}

/* ---------- Card ---------- */
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:100%;aspect-ratio:1.586;padding:12px 14px;border-radius:18px;overflow:hidden;isolation:isolate;text-align:left;color:var(--card-ink,#fff);
  background:radial-gradient(130% 100% at 100% 0%,rgba(255,255,255,.32),rgba(255,255,255,0) 55%),linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:0 14px 26px -18px var(--c1);container-type:inline-size;transition:transform .18s var(--ease)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);pointer-events:none}
button.card:active{transform:scale(.965)}
.card-top{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0;max-width:100%}
.card-name{font-size:15px;line-height:1.2;font-weight:700;letter-spacing:-.012em;max-width:82%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.has-logo .card-name{-webkit-line-clamp:1;max-width:100%}
.card.has-logo .card-mono{display:none}
.card-logo{display:flex;align-items:center;justify-content:center;flex:none;align-self:flex-start;height:56px;height:34cqw;aspect-ratio:1;padding:4px;padding:2.2cqw;border-radius:12px;border-radius:5.5cqw;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.card-logo.is-wide{height:auto;width:130px;width:80cqw;aspect-ratio:2.6}
.card-logo img{display:block;width:100%;height:100%;object-fit:contain}
.card-logo.plate-dark{background:#17191E}
.card-logo.plate-none{background:transparent;box-shadow:none;padding:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.card-num{display:none;font-size:13px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums;opacity:.88}
.card-mono{position:absolute;right:-.04em;bottom:-.26em;z-index:-1;font-size:104px;font-size:62cqw;line-height:1;font-weight:800;letter-spacing:-.06em;color:var(--card-mono,rgba(255,255,255,.17));pointer-events:none}
.card--lg{padding:18px 20px;border-radius:24px}
.card--lg .card-name{font-size:22px;letter-spacing:-.02em}
.card--lg .card-num{font-size:15px}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:36px 12px 0}
.empty-art{position:relative;height:132px;margin:0 auto 26px;width:200px}
.empty-art span{position:absolute;left:50%;top:10px;width:150px;aspect-ratio:1.586;border-radius:16px;background:radial-gradient(130% 100% at 100% 0%,rgba(255,255,255,.32),rgba(255,255,255,0) 55%),linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 18px 30px -20px var(--c1)}
.empty-art span:nth-child(1){transform:translateX(-50%) translate(-34px,8px) rotate(-12deg)}
.empty-art span:nth-child(2){transform:translateX(-50%) translate(34px,8px) rotate(11deg)}
.empty-art span:nth-child(3){transform:translateX(-50%) translateY(-2px)}
.empty h2{font-size:24px;line-height:1.15;letter-spacing:-.025em;margin:0 0 8px}
.empty p{color:var(--ink-2);margin:0 auto 24px;max-width:300px}

/* ---------- Buttons ---------- */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 26px;border-radius:999px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.01em;transition:transform .15s,opacity .15s}
.btn-primary:active{transform:scale(.97)}
.btn-primary svg.i{width:20px;height:20px}
.btn-block{display:flex;width:100%}
.btn-link{display:block;margin:14px auto 0;padding:10px 12px;color:var(--accent);font-weight:600;font-size:16px}
.btn-danger{background:var(--danger)}
.btn-secondary{background:var(--surface-2);color:var(--ink)}
.fab-wrap{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:28px 16px calc(env(safe-area-inset-bottom) + 18px);pointer-events:none;background:linear-gradient(to top,var(--bg) 45%,transparent)}
.fab-wrap .btn-primary{pointer-events:auto;box-shadow:0 14px 30px -14px var(--accent);padding:0 26px 0 22px}

/* ---------- Layers ---------- */
.layer{position:fixed;inset:0;z-index:20}
.page{background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .42s var(--ease);box-shadow:-20px 0 40px -30px rgba(0,0,0,.4)}
.page.is-open{transform:none}
.modal{background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s var(--ease)}
.modal.is-open{transform:none}
.sheet-wrap{display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
.sheet-wrap.is-open .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(100%);transition:transform .45s var(--ease)}
@media (prefers-color-scheme: dark){.sheet{background:#1C1D22}}
.sheet-wrap.is-open .sheet{transform:none}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--surface-2);margin:0 auto 14px}
.sheet-title{font-size:22px;font-weight:700;letter-spacing:-.022em;margin:2px 4px 10px}
.sheet-text{color:var(--ink-2);margin:0 4px 18px;font-size:15px}
.sheet-foot{color:var(--ink-2);font-size:13px;margin:16px 4px 0;line-height:1.5}
.sheet-buttons{display:flex;flex-direction:column;gap:10px}

.row{display:flex;align-items:center;gap:14px;width:100%;padding:10px 6px;border-radius:16px;text-align:left;transition:background .15s}
.row:active{background:var(--press)}
.row-ico{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.row-ico svg.i{width:21px;height:21px}
.row-title{display:block;font-weight:600;font-size:16px;letter-spacing:-.005em}
.row-sub{display:block;font-size:14px;color:var(--ink-2);margin-top:1px}

/* ---------- Detail ---------- */
.page-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--bg)}
.page-body{max-width:560px;margin:0 auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 36px)}
.code-panel{display:block;width:100%;margin-top:14px;padding:24px 26px 18px;border-radius:24px;background:#fff;color:#111;text-align:center}
@media (prefers-color-scheme: light){.code-panel{box-shadow:0 1px 2px rgba(16,24,40,.05)}}
.code-svg{display:flex;justify-content:center;align-items:center;min-height:60px}
.code-svg svg{display:block;width:100%;height:auto;max-height:150px}
.code-svg.is-2d svg{width:auto;height:200px;max-width:100%;max-height:none}
.code-svg.is-stack svg{max-height:160px}
.code-num{margin-top:12px;font-size:21px;font-weight:600;letter-spacing:.07em;font-variant-numeric:tabular-nums;color:#111;overflow-wrap:anywhere;line-height:1.25}
.code-num.is-long{font-size:15px;letter-spacing:.01em;font-weight:500}
.code-missing{margin:0;color:#6F7480;font-size:15px}
.hint{text-align:center;color:var(--ink-2);font-size:13px;margin:10px 0 0}
.warn{color:#B4540B;font-size:13px;margin:10px 4px 0;text-align:center}
@media (prefers-color-scheme: dark){.warn{color:#FFB86B}}
.actions{display:flex;justify-content:center;gap:30px;margin:24px 0 6px}
.action{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;min-width:56px}
.action-ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--accent);transition:transform .15s}
.action:active .action-ico{transform:scale(.92)}
.action--danger .action-ico{color:var(--danger)}
.group{background:var(--surface);border-radius:20px;margin-top:20px;padding:2px 16px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);margin:0}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--ink-2);flex:none}
.kv dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.kv--stack{display:block}
.kv--stack dd{text-align:left;margin-top:4px;font-weight:400;white-space:pre-wrap}

/* ---------- Cashier mode ---------- */
.cashier{background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 56px);opacity:0;transition:opacity .22s;cursor:pointer}
.cashier.is-open{opacity:1}
.cashier-name{font-size:17px;font-weight:600;color:#6F7480;margin:0 0 28px;text-align:center}
.cashier .code-svg{width:100%;max-width:560px}
.cashier .code-svg svg{max-height:42vh}
.cashier .code-svg.is-2d svg{height:min(72vw,360px)}
.cashier .code-num{font-size:26px;margin-top:22px;text-align:center}
.cashier .code-num.is-long{font-size:17px}
.cashier-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center;color:#9A9EA8;font-size:14px;margin:0}

/* ---------- Edit ---------- */
.modal-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;flex:none}
.text-btn{justify-self:start;color:var(--accent);font-weight:600;font-size:17px;padding:10px 6px}
.modal-title{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.modal-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 24px}
.modal-scroll>*{max-width:528px;margin-left:auto;margin-right:auto}
.modal-foot{flex:none;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:var(--bg)}
.modal-foot .btn-primary{max-width:528px;margin:0 auto}
.edit-preview{width:68%;max-width:300px;margin:4px auto 22px}
.field{position:relative;display:block;background:var(--surface);border-radius:18px;padding:11px 16px 11px;margin-top:10px;transition:box-shadow .15s}
.field-label{display:block;font-size:13px;color:var(--ink-2);font-weight:500;margin-bottom:1px}
.field input,.field textarea,.field select{display:block;width:100%;border:0;background:transparent;color:var(--ink);font-size:17px;font-weight:500;line-height:1.35;padding:0;margin:0;-webkit-appearance:none;appearance:none;border-radius:0}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-2);opacity:.65;font-weight:400}
.field textarea{resize:none;min-height:48px}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.field.has-error{box-shadow:inset 0 0 0 2px var(--danger)}
.field--select select{padding-right:28px;cursor:pointer}
.field--select .chev{position:absolute;right:14px;bottom:13px;color:var(--ink-2);pointer-events:none}
.field--select .chev svg.i{width:18px;height:18px}
.field-error{color:var(--danger);font-size:13px;font-weight:500;margin:6px 6px 0}
.field-note{color:var(--ink-2);font-size:13px;margin:8px 6px 0}
.field-note.is-warn{color:#B4540B}
@media (prefers-color-scheme: dark){.field-note.is-warn{color:#FFB86B}}
.code-panel--sm{padding:18px 22px 14px;border-radius:18px;margin-top:10px}
.code-panel--sm .code-svg svg{max-height:96px}
.code-panel--sm .code-svg.is-2d svg{height:120px}
.code-placeholder{margin:0;color:#9A9EA8;font-size:14px;padding:18px 0}
.section-label{font-size:13px;font-weight:500;color:var(--ink-2);margin:22px 6px 10px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px;padding:14px 10px;background:var(--surface);border-radius:18px}
.swatch{justify-self:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative;transition:transform .15s}
.swatch:active{transform:scale(.9)}
.swatch[aria-checked="true"]::after{content:"";position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 0 2.5px var(--ink)}
.swatch-sub{grid-column:1/-1;margin:0 0 -4px 4px;font-size:12px;font-weight:500;color:var(--ink-2)}
.logo-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:-8px 0 16px}
.chip-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;background:var(--surface);color:var(--accent);font-weight:600;font-size:15px;transition:transform .15s}
.chip-btn:active{transform:scale(.96)}
.chip-btn svg.i{width:17px;height:17px}
.chip-btn--muted{color:var(--ink-2)}

/* ---------- Ritaglio logo ---------- */
.cropper{background:#0B0C0F;color:#F5F6F8;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s var(--ease)}
.cropper.is-open{transform:none}
.cropper .text-btn{color:#6AA6FF}
.cropper .text-btn--end{justify-self:end;font-weight:700}
.crop-stage{position:relative;flex:1;min-height:200px;overflow:hidden;touch-action:none;cursor:grab;background:repeating-conic-gradient(#191B21 0 25%,#121418 0 50%) 0 0/22px 22px}
.crop-stage:active{cursor:grabbing}
.crop-plate{position:absolute;border-radius:16px;transition:background .2s}
.crop-img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;pointer-events:none}
.crop-mask{position:absolute;border-radius:16px;box-shadow:0 0 0 200vmax rgba(8,9,12,.66);outline:2px solid rgba(255,255,255,.92);outline-offset:0;pointer-events:none}
.crop-panel{flex:none;background:#16181D;border-radius:24px 24px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);margin-top:-12px;position:relative;z-index:2}
.crop-preview{width:44%;max-width:190px;margin:0 auto 6px}
.crop-row{display:flex;align-items:center;gap:12px;margin-top:10px;max-width:528px;margin-left:auto;margin-right:auto}
.crop-label{flex:none;width:68px;font-size:13px;font-weight:500;color:#9A9EA8}
.crop-seg{display:flex;flex:1;padding:3px;border-radius:999px;background:#24272E}
.crop-seg button{flex:1;height:32px;padding:0 4px;border-radius:999px;font-size:13.5px;font-weight:600;color:#A3A7B0;white-space:nowrap}
.crop-seg button[aria-pressed="true"]{background:#40444E;color:#fff}
.zoom{flex:1;margin:0;accent-color:#6AA6FF;height:28px}
.crop-toggle{cursor:pointer}
.crop-toggle .crop-label{width:auto;flex:1;font-size:15px;color:#E6E8EC}
.switch{position:relative;flex:none;width:51px;height:31px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:#3A3D45;transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.switch input:checked+span{background:#34C759}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid #6AA6FF;outline-offset:2px}

/* ---------- Aggiungi loghi in sequenza ---------- */
.queue-progress{justify-self:end;color:var(--ink-2);font-size:15px;font-weight:500;padding-right:6px;font-variant-numeric:tabular-nums}
.queue-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 24px calc(env(safe-area-inset-bottom) + 24px);text-align:center}
.queue-card{width:min(76%,320px);margin-bottom:24px}
.queue-name{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.queue-sub{color:var(--ink-2);margin:0 0 24px;max-width:300px}
.queue-done{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:18px}
.queue-done svg.i{width:30px;height:30px}

/* ---------- Scanner ---------- */
.scanner{background:#000;color:#fff;overflow:hidden;transform:translateY(100%);transition:transform .45s var(--ease)}
.scanner.is-open{transform:none}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.scan-frame{position:absolute;left:50%;top:44%;width:min(86vw,440px);aspect-ratio:1.75;transform:translate(-50%,-50%);border-radius:24px;box-shadow:0 0 0 200vmax rgba(0,0,0,.52)}
.scan-frame i{position:absolute;width:34px;height:34px;border:4px solid #fff;transition:border-color .2s}
.scan-frame i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0;border-top-left-radius:24px}
.scan-frame i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0;border-top-right-radius:24px}
.scan-frame i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0;border-bottom-left-radius:24px}
.scan-frame i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0;border-bottom-right-radius:24px}
.scan-frame.is-found i{border-color:#2ED47A}
.scan-line{position:absolute;left:8%;right:8%;top:50%;height:2px;border-radius:2px;background:rgba(255,255,255,.85);box-shadow:0 0 14px 2px rgba(61,139,255,.9);animation:scanline 2.2s ease-in-out infinite}
@keyframes scanline{0%,100%{transform:translateY(-60px);opacity:.35}50%{transform:translateY(60px);opacity:1}}
.scan-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.glass{background:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.scan-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom) + 26px);text-align:center}
.scan-hint{font-size:17px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.scan-sub{font-size:14px;color:rgba(255,255,255,.7);margin:0 0 20px}
.scan-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px}
.pill svg.i{width:18px;height:18px}
.scan-error{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;background:#000}
.scan-error h2{font-size:22px;margin:0 0 10px;letter-spacing:-.02em}
.scan-error p{color:rgba(255,255,255,.72);margin:0 0 26px;max-width:320px}
.scan-error .scan-actions{flex-direction:column;align-items:stretch;width:100%;max-width:300px}
.scan-error .pill{justify-content:center}
.pill--light{background:#fff;color:#111}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:100;max-width:calc(100% - 32px);width:max-content;padding:12px 18px;border-radius:18px;background:var(--toast-bg);color:var(--toast-ink);font-size:15px;font-weight:600;line-height:1.35;text-align:center;transform:translate(-50%,calc(-100% - 40px));transition:transform .4s var(--ease);box-shadow:0 12px 30px -12px rgba(0,0,0,.35);pointer-events:none}
.toast.is-on{transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
}
</style>
</head>

    </div>
    <p class="subtitle" id="count"></p>
  </header>

  <div class="install" id="install" hidden>
    <div class="install-ico" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg></div>
    <p class="install-text"><strong>Installa Tessere sull'iPhone</strong>Tocca Condividi in Safari, poi «Aggiungi alla schermata Home».</p>

  </div>

  <div class="tools" id="tools">
    <label class="search">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Cerca" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Cerca tra le tessere">
      <button class="search-clear" id="searchClear" type="button" aria-label="Cancella ricerca" hidden><svg class="i" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </label>
    <div class="seg" role="group" aria-label="Ordina">
      <button type="button" data-sort="recent">Recenti</button>
      <button type="button" data-sort="az">A–Z</button>

  <main class="grid" id="grid" aria-label="Le tue tessere"></main>

  <section class="empty" id="empty" hidden>

      <span style="--c1:#00996F;--c2:#62E6B5"></span>
      <span style="--c1:#0666EB;--c2:#2AB6FF"></span>
    </div>

    <p>Inquadra il codice a barre di una carta fedeltà e salvala qui, pronta da mostrare in cassa.</p>
    <button class="btn-primary" id="emptyScan" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Scansiona una tessera</button>
    <button class="btn-link" id="emptyManual" type="button">Inserisci il numero a mano</button>
  </section>
</div>

<div class="fab-wrap" id="fab" hidden>
  <button class="btn-primary" id="btnAdd" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Aggiungi tessera</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json,text/plain" hidden>
<input type="file" id="logoInput" accept="image/*,.svg" hidden>

var scriptCache = {};

    var s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = function () { test() ? resolve() : reject(new Error('Libreria non valida: ' + src)); };
    s.onerror = function () { delete scriptCache[src]; reject(new Error('Impossibile caricare ' + src)); };
    document.head.appendChild(s);

function ensureBwip() { return loadScript('vendor/bwip-js.min.js', function () { return !!window.bwipjs; }); }

var db = load();
function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.cards)) {
        return { cards: d.cards.map(sanitize).filter(Boolean), prefs: Object.assign({ sort: 'recent' }, d.prefs || {}) };
      }
    }
  } catch (e) { }
  return { cards: [], prefs: { sort: 'recent' } };
}
var askedPersist = false;
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    if (!askedPersist && db.cards.length && navigator.storage && navigator.storage.persist) {
      askedPersist = true;
      navigator.storage.persist().catch(function () { });
    }
    return true;
  } catch (e) {

    id: typeof r.id === 'string' && r.id ? r.id : uid(),
    name: name,

    format: FORMAT_BY_ID[r.format] ? r.format : detectFormat(number),
    color: isValidColor(r.color) ? r.color : autoColor(name),
    palette: Array.isArray(r.palette) ? r.palette.filter(isHex).slice(0, 4) : [],
    logo: sanitizeLogo(r.logo),
    note: String(r.note == null ? '' : r.note).slice(0, 500),
    createdAt: +r.createdAt || Date.now(),

function byId(id) { for (var i = 0; i < db.cards.length; i++) if (db.cards[i].id === id) return db.cards[i]; return null; }

  var n = (num || '').trim();

var layers = [];
var histOK = true;
try { history.replaceState({ layer: 0 }, ''); } catch (e) { histOK = false; }

  opts = opts || {};
  document.body.appendChild(el);
  var entry = { el: el, onClose: opts.onClose };
  if (opts.replace && layers.length) {
    hideLayer(layers.pop());
    layers.push(entry);
    if (histOK) { try { history.replaceState({ layer: layers.length }, ''); } catch (e) { } }
  } else {
    layers.push(entry);
    if (histOK) { try { history.pushState({ layer: layers.length }, ''); } catch (e) { histOK = false; } }
  }
  document.body.classList.add('has-layer');

  return el;
}
function hideLayer(entry) {

  try { if (entry.onClose) entry.onClose(); } catch (e) { }
  setTimeout(function () { entry.el.remove(); }, 480);

}

  el.addEventListener('click', function (e) {

function mountCode(container, card, onResult) {
  function paint() {
    var r = barcodeSVG(card.number, card.format);
    if (!r) {
      container.innerHTML = '<p class="code-missing">Impossibile disegnare questo codice. Mostra il numero al cassiere.</p>';
      container.classList.remove('is-2d', 'is-stack');
    } else {
      container.innerHTML = r.svg;
      var svg = container.querySelector('svg');
      if (svg) {
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', 'Codice ' + labelOf(r.format));
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      }
      var k = kindOf(r.format);
      container.classList.toggle('is-2d', k === '2d');
      container.classList.toggle('is-stack', k === 'stack');
    }
    if (onResult) onResult(r);
  }
  if (window.bwipjs) { paint(); return; }
  container.innerHTML = '<p class="code-missing">Preparo il codice…</p>';
  ensureBwip().then(paint).catch(function () {
    container.innerHTML = '<p class="code-missing">Non riesco a caricare il generatore di codici. Riapri l\'app con la connessione attiva una volta.</p>';
  });
}

      '<div class="page-body">' +

          (c.note ? '<div class="kv kv--stack"><dt>Nota</dt><dd>' + esc(c.note) + '</dd></div>' : '') +

function loadImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { resolve(img); setTimeout(function () { URL.revokeObjectURL(url); }, 1000); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('img')); };

  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));

}

  return loadImage(file).then(function (img) {
    return getNativeEngine().then(function (native) {
      return ensureZXingEngine().catch(function () { return null; }).then(function (zx) {
        var engines = [native, zx].filter(Boolean);
        if (!engines.length) throw new Error('nessun lettore');
        var sizes = [1400, 900, 2200];
        var i = 0;
        function next() {
          if (i >= sizes.length * engines.length) return Promise.resolve(null);
          var size = sizes[Math.floor(i / engines.length)], eng = engines[i % engines.length];
          i++;
          return eng.decode(drawScaled(img, size)).then(function (r) { return r || next(); }, next);
        }

    });
  });
}

/* ---------- Scanner fotocamera ---------- */
function openScanner(opts) {
  var el = makeLayer('scanner', 'Scansiona tessera');
  el.innerHTML =
    '<video playsinline muted autoplay></video>' +
    '<div class="scan-frame"><i></i><i></i><i></i><i></i><div class="scan-line"></div></div>' +
    '<div class="scan-top"><button class="icon-btn glass" type="button" data-action="close" aria-label="Chiudi">' + icon('close') + '</button></div>' +
    '<div class="scan-bottom">' +
      '<p class="scan-hint">Inquadra il codice a barre</p>' +
      '<p class="scan-sub">Tieni la tessera ferma e ben illuminata</p>' +
      '<div class="scan-actions">' +
        '<button class="pill glass" type="button" data-action="photo">' + icon('image') + 'Scegli foto</button>' +
        '<button class="pill glass" type="button" data-action="manual">' + icon('hash') + 'Inserisci numero</button>' +
      '</div>' +
    '</div>' +
    '<div class="scan-error" hidden></div>';

  var video = $('video', el), frame = $('.scan-frame', el), errBox = $('.scan-error', el);
  var stream = null, stopped = false, timer = null;
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var lastText = null, lastCount = 0;

  function stop() {
    stopped = true;
    clearTimeout(timer);
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
  }
  function showError(title, text) {
    stop();
    errBox.hidden = false;
    errBox.innerHTML = '<h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>' +
      '<div class="scan-actions">' +
        '<button class="pill pill--light" type="button" data-action="photo">' + icon('image') + 'Scegli una foto</button>' +
        '<button class="pill glass" type="button" data-action="manual">' + icon('hash') + 'Inserisci il numero</button>' +
        '<button class="pill glass" type="button" data-action="close">Chiudi</button>' +
      '</div>';
  }

  el.addEventListener('click', function (e) {
    var a = e.target.closest('[data-action]');
    if (!a) return;
    if (a.dataset.action === 'close') closeLayers(1);
    else if (a.dataset.action === 'manual') { stop(); openEdit({ replace: true }); }
    else if (a.dataset.action === 'photo') { stop(); pickPhoto(); closeLayers(1); }
  });

  openLayer(el, { replace: opts && opts.replace, onClose: stop });

  if (!window.isSecureContext) {
    showError('Fotocamera non disponibile', 'La fotocamera funziona solo quando l\'app è aperta da un indirizzo https://. Puoi comunque scegliere una foto o inserire il numero.');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('Fotocamera non disponibile', 'Questo browser non dà accesso alla fotocamera. Puoi scegliere una foto del codice o inserire il numero.');
    return;
  }

  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
  }).then(function (s) {
    if (stopped) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
    stream = s;
    video.srcObject = s;
    var p = video.play();
    if (p && p.catch) p.catch(function () { });
    return getLiveEngine().then(function (engine) {
      if (!stopped) loop(engine);
    }, function () {
      showError('Lettore non disponibile', 'Non riesco a caricare il lettore di codici. Riapri l\'app con la connessione attiva una volta, poi funzionerà anche offline.');
    });
  }).catch(function (err) {
    if (stopped) return;
    var name = err && err.name;
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      showError('Accesso alla fotocamera negato', 'Consenti l\'uso della fotocamera quando l\'app lo chiede. Se l\'hai negato, vai in Impostazioni › Safari › Fotocamera e scegli «Chiedi».');
    } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      showError('Nessuna fotocamera trovata', 'Questo dispositivo non ha una fotocamera utilizzabile. Puoi scegliere una foto o inserire il numero.');
    } else {
      showError('Fotocamera non disponibile', 'La fotocamera è occupata o non risponde. Chiudi le altre app che la usano e riprova.');
    }
  });

  function cropRect() {
    var vw = video.videoWidth, vh = video.videoHeight;
    var vr = video.getBoundingClientRect(), fr = frame.getBoundingClientRect();
    var s = Math.max(vr.width / vw, vr.height / vh);
    var ox = vr.left + (vr.width - vw * s) / 2, oy = vr.top + (vr.height - vh * s) / 2;
    var padX = fr.width * 0.15, padY = fr.height * 0.3;
    var x = (fr.left - padX - ox) / s, y = (fr.top - padY - oy) / s;
    var w = (fr.width + padX * 2) / s, h = (fr.height + padY * 2) / s;
    x = Math.max(0, x); y = Math.max(0, y);
    w = Math.min(vw - x, w); h = Math.min(vh - y, h);
    if (!(w > 10 && h > 10)) return { x: 0, y: 0, w: vw, h: vh };
    return { x: x, y: y, w: w, h: h };
  }

  function loop(engine) {
    function tick() {
      if (stopped) return;
      if (video.readyState < 2 || !video.videoWidth) { timer = setTimeout(tick, 120); return; }
      var r = cropRect();
      var scale = Math.min(1, 1100 / r.w);
      canvas.width = Math.max(1, Math.round(r.w * scale));
      canvas.height = Math.max(1, Math.round(r.h * scale));
      ctx.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, canvas.width, canvas.height);
      engine.decode(canvas).then(function (res) {
        if (stopped) return;
        if (res && res.text) {
          if (res.text === lastText) lastCount++; else { lastText = res.text; lastCount = 1; }
          if (STRONG[res.format] || lastCount >= 2) { found(res); return; }
        }
        timer = setTimeout(tick, 80);
      }, function () { if (!stopped) timer = setTimeout(tick, 150); });
    }
    tick();
  }

  function found(res) {
    frame.classList.add('is-found');
    stop();
    setTimeout(function () { handleFound(res, true); }, 260);
  }
}

  renderPreview();
  renderCode();

      '<div class="crop-row"><span class="crop-label">Piastrina</span><div class="crop-seg" data-seg="plate">' +
        '<button type="button" data-v="auto">Auto</button><button type="button" data-v="light">Bianca</button>' +
        '<button type="button" data-v="dark">Scura</button><button type="button" data-v="none">Nessuna</button></div></div>' +

/* =========================================================
   Aggiungi loghi in sequenza
   ========================================================= */
function cardsWithoutLogo() {
  return db.cards.slice()
    .sort(function (a, b) { return (b.lastUsed || b.createdAt) - (a.lastUsed || a.createdAt); })
    .filter(function (c) { return !(c.logo && getLogoData(c.id)); });
}
function applyLogo(card, res) {
  if (!setLogoData(card.id, res.src)) { toast('Memoria piena: non riesco a salvare il logo', 3500); return false; }
  card.logo = res.meta;
  card.palette = res.colors;
  card.color = res.colors[0] || 'notte';
  card.updatedAt = Date.now();
  save();
  renderHome();
  return true;
}
function openLogoQueue(opts) {
  var queue = cardsWithoutLogo().map(function (c) { return c.id; });
  if (!queue.length) { toast('Tutte le tessere hanno già un logo'); return; }
  var idx = 0, added = 0;
  var el = makeLayer('modal', 'Aggiungi loghi');
  function render() {
    while (idx < queue.length && !byId(queue[idx])) idx++;
    if (idx >= queue.length) {
      el.innerHTML =
        '<div class="modal-bar"><span></span><h2 class="modal-title">Aggiungi loghi</h2><span></span></div>' +
        '<div class="queue-body"><div class="queue-done">' + icon('check') + '</div>' +
        '<p class="queue-name">Fatto</p>' +
        '<p class="queue-sub">' + (added ? 'Hai aggiunto ' + added + ' ' + plural(added, 'logo', 'loghi') + '.' : 'Nessun logo aggiunto.') + '</p>' +
        '<button class="btn-primary" type="button" data-action="close">Chiudi</button></div>';
      return;
    }
    var c = byId(queue[idx]);
    el.innerHTML =
      '<div class="modal-bar"><button class="text-btn" type="button" data-action="close">Fine</button>' +
      '<h2 class="modal-title">Aggiungi loghi</h2><span class="queue-progress">' + (idx + 1) + ' di ' + queue.length + '</span></div>' +
      '<div class="queue-body"><div class="queue-card">' + cardHTML(c, 'div') + '</div>' +
      '<p class="queue-name">' + esc(c.name) + '</p>' +
      '<p class="queue-sub">Scegli il file del logo dalla tua cartella in File.</p>' +
      '<button class="btn-primary" type="button" data-action="pick">' + icon('image') + 'Scegli logo</button>' +
      '<button class="btn-link" type="button" data-action="skip">Salta questa tessera</button></div>';
  }
  el.addEventListener('click', function (e) {
    var a = e.target.closest('[data-action]');
    if (!a) return;
    if (a.dataset.action === 'close') closeLayers(1);
    else if (a.dataset.action === 'skip') { idx++; render(); }
    else if (a.dataset.action === 'pick') {
      var c = byId(queue[idx]);
      if (!c) return;
      pickLogo(function (file) {
        openCropper(file, {
          name: c.name, number: c.number,
          onUse: function (res) {
            if (applyLogo(c, res)) { added++; idx++; render(); }
          }
        });
      });
    }

  render();
  openLayer(el, { replace: opts && opts.replace });
}

var importInput = $('#importInput');

  openSheet(
    '<h2 class="sheet-title">Impostazioni</h2>' +
    (n ? '<button class="row" type="button" data-action="logos"><span class="row-ico">' + icon('image') + '</span><span><span class="row-title">Aggiungi loghi</span><span class="row-sub">' +
      (missing ? missing + ' ' + plural(missing, 'tessera senza logo', 'tessere senza logo') : 'Tutte le tessere hanno un logo') + '</span></span></button>' : '') +
    '<button class="row" type="button" data-action="export"><span class="row-ico">' + icon('download') + '</span><span><span class="row-title">Esporta backup</span><span class="row-sub">Salva un file con tutte le tessere e i loghi</span></span></button>' +
    '<button class="row" type="button" data-action="import"><span class="row-ico">' + icon('upload') + '</span><span><span class="row-title">Importa backup</span><span class="row-sub">Recupera le tessere da un file esportato</span></span></button>' +

      else if (action === 'logos') openLogoQueue({ replace: true });
    }

}
function backupJSON() {
  return JSON.stringify({
    app: 'tessere', version: 2, exportedAt: new Date().toISOString(),
    cards: db.cards.map(function (c) {
      var o = Object.assign({}, c), d = c.logo ? getLogoData(c.id) : null;

}
function exportBackup() {
  if (!db.cards.length) { toast('Non ci sono tessere da esportare'); return; }
  var data = backupJSON();
  var name = 'tessere-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  var files = [];
  try {
    files.push(new File([data], name, { type: 'application/json' }));
    files.push(new File([data], name, { type: 'text/plain' }));
  } catch (e) { }
  for (var i = 0; i < files.length; i++) {
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [files[i]] })) {
      navigator.share({ files: [files[i]], title: 'Backup tessere' }).then(function () {
        toast('Backup esportato');
      }, function (err) {
        if (!err || err.name !== 'AbortError') downloadBlob(data, name);
      });
      return;
    }
  }
  downloadBlob(data, name);
}
function downloadBlob(data, name) {
  var url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  toast('Backup esportato');
}
importInput.addEventListener('change', function () {
  var file = importInput.files && importInput.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () { importBackup(String(reader.result || '')); };
  reader.onerror = function () { toast('Non riesco a leggere il file'); };
  reader.readAsText(file);
});
function validLogoData(v) {
  return typeof v === 'string' && v.length < 800000 && /^data:image\/(png|jpeg|webp|svg\+xml);base64,/.test(v);
}
function importBackup(text) {
  var data;
  try { data = JSON.parse(text); } catch (e) { toast('Questo file non è un backup di Tessere'); return; }
  var list = Array.isArray(data) ? data : (data && data.cards);
  if (!Array.isArray(list)) { toast('Questo file non è un backup di Tessere'); return; }
  var added = 0, updated = 0, lostLogos = 0;
  list.forEach(function (raw) {
    var c = sanitize(raw);
    if (!c) return;
    var logo = c.logo && validLogoData(raw.logoData) ? raw.logoData : null;
    if (!logo) c.logo = null;
    var cur = byId(c.id);
    if (cur && (c.updatedAt || 0) <= (cur.updatedAt || 0)) return;
    if (logo && !setLogoData(c.id, logo)) { c.logo = null; lostLogos++; }
    if (!logo && cur) setLogoData(c.id, null);
    if (!cur) { db.cards.push(c); added++; }
    else { Object.assign(cur, c); updated++; }
  });
  if (!added && !updated) { toast('Nessuna tessera nuova nel backup'); return; }
  if (!save()) return;
  renderHome();
  closeLayers(layers.length);
  var parts = [];
  if (added) parts.push(added + ' ' + plural(added, 'tessera importata', 'tessere importate'));
  if (updated) parts.push(updated + ' ' + plural(updated, 'aggiornata', 'aggiornate'));
  if (lostLogos) parts.push(lostLogos + ' ' + plural(lostLogos, 'logo non salvato', 'loghi non salvati') + ' per memoria piena');
  toast(parts.join(', '), lostLogos ? 4000 : 2400);
}
